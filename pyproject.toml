[project]
name = "eventure"
version = "0.1.0"
description = "An MCP server that exposes a simple API to publish/subscribe to local events, enabling AI agents to coordinate via event bus."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9,<2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
eventure = "eventure.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eventure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
